<!DOCTYPE html>
<html>
<head>
  <title>Camera Control Panel</title>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
  <h1>Camera Control Panel</h1>
  <div id="camera-list"></div>

  <script>
    // Fetch the list of cameras when the page loads
    $(document).ready(function() {
      $.getJSON('/cameras', function(data) {
        data.forEach(function(camera) {
          // Create a div for each camera
          var cameraDiv = $('<div></div>');
          cameraDiv.text(camera.name);

          // Create a button for each camera
          var toggleButton = $('<button>Toggle Stream</button>');
          toggleButton.click(function() {
            $.post('/cameras/' + camera.id + '/toggle', function(data) {
              alert('Toggled stream for ' + camera.name);
            });
          });

          // Add the button to the div
          cameraDiv.append(toggleButton);

          // Add the div to the camera list
          $('#camera-list').append(cameraDiv);
        });
      });
    });
  </script>
</body>
</html>

    var buttonText = camera.isStreaming ? 'Stop Stream' : 'Start Stream';
    var toggleButton = $('<button>' + buttonText + '</button>');

    toggleButton.click(function() {

        toggleButton.text(data.isStreaming ? 'Stop Stream' : 'Start Stream');

        // Update the button color based on the new streaming status
        toggleButton.css('background-color', data.isStreaming ? 'green' : 'lightgray');
      });
    });

    // Set the initial button color based on the streaming status
    toggleButton.css('background-color', camera.isStreaming ? 'green' : 'lightgray');

    // ...
  });
</script>
